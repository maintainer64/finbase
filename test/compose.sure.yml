# Sure для интеграционных тестов (CI). Минимальный набор: web + db + redis.
# Образ we-promise/sure сам прогоняет db:prepare на старте.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sure_user -d sure_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Воркер нужен, чтобы Sure пересчитывал holdings из сделок (SyncJob).
  worker:
    image: ghcr.io/we-promise/sure:stable
    command: bundle exec sidekiq
    volumes:
      - ../sure-initializers/self_hosted_tweaks.rb:/rails/config/initializers/self_hosted_tweaks.rb:ro
      - ../sure-initializers/fx_rates.rb:/rails/config/initializers/fx_rates.rb:ro
    environment:
      # Провайдер котировок: без него Security::Resolver не находит бумагу
      # и создаёт offline-заглушку, по которой цены никогда не обновляются.
      SECURITIES_PROVIDERS: moex_public
      SECRET_KEY_BASE: ci_secret_key_base_ci_secret_key_base_ci_secret_key_base_ci_secret_key_base
      SELF_HOSTED: "true"
      SURE_IMPORT_MAX_NDJSON_SIZE_MB: ${SURE_MAX_UPLOAD_SIZE_MB:-100}
      SURE_IMPORT_MAX_ROWS: ${SURE_MAX_IMPORT_ROWS:-500000}
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_test
      REDIS_URL: redis://redis:6379/1

  web:
    image: ghcr.io/we-promise/sure:stable
    volumes:
      - ../sure-initializers/self_hosted_tweaks.rb:/rails/config/initializers/self_hosted_tweaks.rb:ro
      - ../sure-initializers/trade_external_id.rb:/rails/config/initializers/trade_external_id.rb:ro
      - ../sure-initializers/fx_rates.rb:/rails/config/initializers/fx_rates.rb:ro

    environment:
      # Провайдер котировок: без него Security::Resolver не находит бумагу
      # и создаёт offline-заглушку, по которой цены никогда не обновляются.
      SECRET_KEY_BASE: ci_secret_key_base_ci_secret_key_base_ci_secret_key_base_ci_secret_key_base
      SELF_HOSTED: "true"
      SURE_IMPORT_MAX_NDJSON_SIZE_MB: ${SURE_MAX_UPLOAD_SIZE_MB:-100}
      SURE_IMPORT_MAX_ROWS: ${SURE_MAX_IMPORT_ROWS:-500000}
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_test
      REDIS_URL: redis://redis:6379/1
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
