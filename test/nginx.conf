server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Динамический DNS внутри docker-сети: при пересоздании контейнера web
    # меняет IP, а nginx пере-резолвит имя каждые 10s (иначе — 502).
    resolver 127.0.0.11 valid=10s;

    location /cable {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Приводим Origin к собственному адресу приложения, чтобы CSRF/Origin-проверка
        # Rails считала запрос same-origin — запросы из расширения приходят с чужим Origin.
        proxy_set_header Origin $scheme://$host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Приводим Origin к собственному адресу приложения (см. пояснение в /cable).
        proxy_set_header Origin $scheme://$host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
